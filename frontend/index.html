<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livro-Caixa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --ink: #161a22;
        --surface: #1e2430;
        --surface-2: #252c3a;
        --rule: #333b4c;
        --paper: #ede7da;
        --paper-dim: #a9a79b;
        --sage: #7fa98e;
        --coral: #d97b66;
        --amber: #d4a24c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 80px;
      }
      header.top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 18px;
        margin-bottom: 22px;
        flex-wrap: wrap;
        gap: 12px;
      }
      header.top h1 {
        font-family: "Fraunces", serif;
        font-weight: 700;
        font-size: 30px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      header.top .sub {
        color: var(--paper-dim);
        font-size: 12.5px;
        font-family: "IBM Plex Mono", monospace;
      }
      .cfg-btn {
        background: none;
        border: 1px solid var(--rule);
        color: var(--paper-dim);
        padding: 6px 12px;
        border-radius: 6px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        cursor: pointer;
      }
      .cfg-btn:hover {
        border-color: var(--paper-dim);
        color: var(--paper);
      }
      .sync-btn {
        background: none;
        border: 1px solid var(--sage);
        color: var(--sage);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        font-family: "IBM Plex Mono", monospace;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 16px 18px;
      }
      .card .label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--paper-dim);
        margin-bottom: 6px;
      }
      .card .value {
        font-family: "IBM Plex Mono", monospace;
        font-size: 23px;
        font-weight: 600;
      }
      .card .value.warn {
        color: var(--coral);
      }
      .card .value.ok {
        color: var(--sage);
      }
      .card .breakdown {
        margin-top: 6px;
        font-size: 11px;
        color: var(--paper-dim);
        font-family: "IBM Plex Mono", monospace;
      }

      .insight {
        font-size: 13px;
        color: var(--paper);
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 10px 16px;
        margin-bottom: 18px;
        line-height: 1.6;
      }

      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 18px;
      }
      .compare .who {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 16px 18px;
      }
      .compare .who .name {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 8px;
      }
      .compare .who .total {
        font-family: "IBM Plex Mono", monospace;
        font-size: 20px;
        margin-bottom: 4px;
      }
      .compare .who .pct {
        font-size: 11.5px;
        color: var(--paper-dim);
        margin-bottom: 10px;
      }
      .compare .who .top-cat {
        font-size: 12px;
        color: var(--paper-dim);
      }
      .compare .who .top-cat b {
        color: var(--paper);
        font-weight: 600;
      }
      .split-track {
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        margin-bottom: 18px;
      }
      .split-track div {
        height: 100%;
      }
      @media (max-width: 800px) {
        .compare {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 18px;
      }
      .panel h2 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 17px;
        margin: 0 0 4px;
      }
      .panel .panel-sub {
        font-size: 11.5px;
        color: var(--paper-dim);
        margin-bottom: 14px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 800px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }

      /* barras horizontais de categoria */
      .barlist {
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .barrow .barrow-top {
        display: flex;
        justify-content: space-between;
        font-size: 12.5px;
        margin-bottom: 4px;
      }
      .barrow .barrow-top .cat {
        color: var(--paper);
      }
      .barrow .barrow-top .val {
        font-family: "IBM Plex Mono", monospace;
        color: var(--paper-dim);
      }
      .barrow .bartrack {
        height: 6px;
        background: var(--surface-2);
        border-radius: 4px;
        overflow: hidden;
      }
      .barrow .barfill {
        height: 100%;
        border-radius: 4px;
      }
      .barlist .empty-small {
        color: var(--paper-dim);
        font-size: 12.5px;
        padding: 12px 0;
      }

      /* navegador de mês */
      .month-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 10px;
      }
      .month-nav button {
        background: var(--surface-2);
        border: 1px solid var(--rule);
        color: var(--paper);
        width: 30px;
        height: 30px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      .month-nav button:hover {
        border-color: var(--paper-dim);
      }
      .month-nav .month-label {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        min-width: 140px;
        text-align: center;
      }

      details.tx-section {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 0;
        margin-bottom: 18px;
      }
      details.tx-section summary {
        cursor: pointer;
        padding: 18px 20px;
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 16px;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      details.tx-section summary::-webkit-details-marker {
        display: none;
      }
      details.tx-section summary .chev {
        color: var(--paper-dim);
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
      }
      details.tx-section .tx-body {
        padding: 0 20px 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        color: var(--paper-dim);
        font-weight: 500;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 8px 10px;
        border-bottom: 1px solid var(--rule);
      }
      td {
        padding: 9px 10px;
        border-bottom: 1px solid #2a3040;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
      }
      td.desc {
        font-family: "Inter", sans-serif;
        font-size: 13px;
      }
      td.amount {
        text-align: right;
      }
      select.tag-select {
        background: var(--surface-2);
        color: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 20px;
        padding: 2px 6px;
        font-size: 11px;
        font-family: "Inter", sans-serif;
      }

      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .filters select,
      .filters input {
        background: var(--surface-2);
        color: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 13px;
        font-family: "Inter", sans-serif;
      }

      .empty {
        color: var(--paper-dim);
        font-size: 13px;
        padding: 30px 0;
        text-align: center;
      }

      .modal-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .modal-bg.show {
        display: flex;
      }
      .modal {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 24px;
        width: 340px;
      }
      .modal h3 {
        font-family: "Fraunces", serif;
        margin-top: 0;
      }
      .modal label {
        display: block;
        font-size: 12px;
        color: var(--paper-dim);
        margin: 14px 0 4px;
      }
      .modal input {
        width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--rule);
        color: var(--paper);
        border-radius: 6px;
        padding: 8px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
      }
      .modal button {
        margin-top: 18px;
        width: 100%;
        background: var(--sage);
        border: none;
        color: #101410;
        font-weight: 600;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <h1>Livro-Caixa</h1>
          <div class="sub" id="statusLine">carregando…</div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center">
          <button class="sync-btn" id="syncBtn">↻ sincronizar agora</button>
          <button class="cfg-btn" id="cfgBtn">config</button>
        </div>
      </header>

      <div class="cards" id="cards"></div>
      <div class="split-track" id="splitTrack"></div>
      <div class="compare" id="compare"></div>
      <div class="insight" id="insight"></div>

      <div class="grid-2">
        <div class="panel">
          <h2>Gasto por categoria</h2>
          <div class="panel-sub">Mês atual · Diogo + Tiago</div>
          <div class="barlist" id="catBars"></div>
        </div>
        <div class="panel">
          <h2>Parcelas em aberto</h2>
          <div class="panel-sub">
            O que ainda falta pagar de compras parceladas
          </div>
          <div class="barlist" id="upcomingBars"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Evolução mensal</h2>
        <div class="panel-sub">Gasto por pessoa, últimos meses</div>
        <canvas id="monthChart" height="220"></canvas>
      </div>

      <details class="tx-section">
        <summary>Lançamentos <span class="chev">▾ ver / filtrar</span></summary>
        <div class="tx-body">
          <div class="month-nav">
            <button id="prevMonth">‹</button>
            <div class="month-label" id="monthLabel"></div>
            <button id="nextMonth">›</button>
          </div>
          <div class="filters">
            <select id="fPerson">
              <option value="">Todos</option>
              <option value="you">Diogo</option>
              <option value="partner">Tiago</option>
            </select>
            <select id="fCategory">
              <option value="">Todas categorias</option>
            </select>
          </div>
          <div id="txTableWrap">
            <div class="empty">Configure a API para carregar os dados.</div>
          </div>
        </div>
      </details>
    </div>

    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h3>Configuração</h3>
        <label>URL do Worker</label>
        <input
          id="apiUrl"
          placeholder="https://financas-worker.SEU-USUARIO.workers.dev"
        />
        <label>Senha da API (API_SECRET)</label>
        <input id="apiSecret" type="password" />
        <button id="saveCfg">Salvar</button>
      </div>
    </div>

    <script>
      const CATEGORIES = [
        "Moradia",
        "Mercado",
        "Alimentação",
        "Transporte",
        "Contas de casa",
        "Assinaturas",
        "Cartão / Dívida",
        "Saúde",
        "Lazer",
        "Transferências",
        "Outros",
      ];
      const CAT_COLORS = {
        Moradia: "#5B8C7B",
        Mercado: "#D4A24C",
        Alimentação: "#E0B84C",
        Transporte: "#7B92C9",
        "Contas de casa": "#C97B5F",
        Assinaturas: "#9B7BC9",
        "Cartão / Dívida": "#C95F5F",
        Saúde: "#5FA8A0",
        Lazer: "#D48CB8",
        Transferências: "#6FA8DC",
        Outros: "#8A8F99",
      };

      // gera uma cor determinística pra qualquer categoria que não esteja no mapa conhecido
      function colorFor(cat) {
        if (CAT_COLORS[cat]) return CAT_COLORS[cat];
        let hash = 0;
        for (let i = 0; i < cat.length; i++)
          hash = cat.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash) % 360;
        return `hsl(${hue},45%,55%)`;
      }

      let cfg = {
        url: localStorage.getItem("fin_api_url") || "",
        secret: localStorage.getItem("fin_api_secret") || "",
      };
      let allCategoriesSeen = [...CATEGORIES]; // é enriquecido com o que vier de fato da Pluggy

      // mês atualmente exibido na seção de lançamentos (yyyy-mm)
      let currentMonth = new Date().toISOString().slice(0, 7);

      function api(path) {
        return fetch(cfg.url + path, {
          headers: { Authorization: "Bearer " + cfg.secret },
        }).then((r) => {
          if (!r.ok) throw new Error("API error " + r.status);
          return r.json();
        });
      }

      document.getElementById("cfgBtn").onclick = () => {
        document.getElementById("apiUrl").value = cfg.url;
        document.getElementById("apiSecret").value = cfg.secret;
        document.getElementById("modalBg").classList.add("show");
      };
      document.getElementById("saveCfg").onclick = () => {
        cfg.url = document.getElementById("apiUrl").value.replace(/\/$/, "");
        cfg.secret = document.getElementById("apiSecret").value;
        localStorage.setItem("fin_api_url", cfg.url);
        localStorage.setItem("fin_api_secret", cfg.secret);
        document.getElementById("modalBg").classList.remove("show");
        loadAll();
      };
      document.getElementById("syncBtn").onclick = async () => {
        document.getElementById("statusLine").textContent =
          "sincronizando com o(s) banco(s)…";
        try {
          await api("/api/sync");
          await loadAll();
        } catch (e) {
          document.getElementById("statusLine").textContent =
            "erro ao sincronizar: " + e.message;
        }
      };

      function fmt(n) {
        return (n || 0).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      let monthChart;

      async function loadAll() {
        if (!cfg.url || !cfg.secret) {
          document.getElementById("statusLine").textContent =
            'clique em "config" para conectar sua API';
          return;
        }
        document.getElementById("statusLine").textContent = "carregando…";
        try {
          const [summary, accounts] = await Promise.all([
            api("/api/summary"),
            api("/api/accounts"),
          ]);
          renderCards(summary, accounts);
          renderMonthChart(summary.byMonth);
          renderCategoryBars(summary.byCategory);
          renderUpcomingBars(summary.upcoming || []);
          updateMonthLabel();

          // popula o filtro de categoria com tudo que já apareceu de verdade nos dados
          allCategoriesSeen = [
            ...new Set([
              ...CATEGORIES,
              ...summary.byCategory.map((r) => r.category).filter(Boolean),
            ]),
          ];
          const catSel = document.getElementById("fCategory");
          const currentVal = catSel.value;
          catSel.innerHTML =
            '<option value="">Todas categorias</option>' +
            allCategoriesSeen
              .map((c) => `<option value="${c}">${c}</option>`)
              .join("");
          catSel.value = currentVal;

          await loadTransactions();
          document.getElementById("statusLine").textContent =
            "atualizado agora • sync automático todo dia às 03h";
        } catch (e) {
          document.getElementById("statusLine").textContent =
            "erro: " + e.message;
        }
      }

      function renderCards(summary, accounts) {
        const porPessoaSaldo = { you: 0, partner: 0 };
        const porPessoaCartao = {
          you: { usado: 0, limite: 0 },
          partner: { usado: 0, limite: 0 },
        };

        accounts.forEach((a) => {
          if (a.type === "BANK")
            porPessoaSaldo[a.person_id] =
              (porPessoaSaldo[a.person_id] || 0) + (a.balance || 0);
          if (a.type === "CREDIT") {
            porPessoaCartao[a.person_id].usado += Math.abs(a.balance || 0);
            porPessoaCartao[a.person_id].limite += a.credit_limit || 0;
          }
        });

        const totalSaldo = porPessoaSaldo.you + porPessoaSaldo.partner;
        const totalUsadoCartao =
          porPessoaCartao.you.usado + porPessoaCartao.partner.usado;
        const totalLimite =
          porPessoaCartao.you.limite + porPessoaCartao.partner.limite;
        const pctLimite = totalLimite
          ? (totalUsadoCartao / totalLimite) * 100
          : 0;
        const gastoMes = summary.byPerson.reduce((s, p) => s + p.total, 0);
        const gastoDiogo =
          summary.byPerson.find((p) => p.person_id === "you")?.total || 0;
        const gastoTiago =
          summary.byPerson.find((p) => p.person_id === "partner")?.total || 0;

        document.getElementById("cards").innerHTML = `
    <div class="card">
      <div class="label">Saldo em conta</div>
      <div class="value">${fmt(totalSaldo)}</div>
      <div class="breakdown">Diogo: ${fmt(porPessoaSaldo.you)} · Tiago: ${fmt(porPessoaSaldo.partner)}</div>
    </div>
    <div class="card">
      <div class="label">Gasto no mês</div>
      <div class="value">${fmt(gastoMes)}</div>
      <div class="breakdown">Diogo: ${fmt(gastoDiogo)} · Tiago: ${fmt(gastoTiago)}</div>
    </div>
    <div class="card">
      <div class="label">Cartão usado</div>
      <div class="value ${pctLimite > 85 ? "warn" : pctLimite > 60 ? "" : "ok"}">${fmt(totalUsadoCartao)} <span style="font-size:12px;color:var(--paper-dim)">(${pctLimite.toFixed(0)}%)</span></div>
      <div class="breakdown">Diogo: ${totalLimiteFmtPct(porPessoaCartao.you)} · Tiago: ${totalLimiteFmtPct(porPessoaCartao.partner)}</div>
    </div>
  `;

        renderComparison(summary, gastoDiogo, gastoTiago);
        renderInsight(summary, gastoDiogo, gastoTiago, pctLimite);
      }

      function totalLimiteFmtPct(c) {
        const pct = c.limite ? ((c.usado / c.limite) * 100).toFixed(0) : "0";
        return `${fmt(c.usado)} (${pct}%)`;
      }

      function renderComparison(summary, gastoDiogo, gastoTiago) {
        const total = gastoDiogo + gastoTiago;
        const pctDiogo = total ? (gastoDiogo / total) * 100 : 50;
        const pctTiago = total ? (gastoTiago / total) * 100 : 50;

        document.getElementById("splitTrack").innerHTML = `
    <div style="width:${pctDiogo}%;background:#7FA98E"></div>
    <div style="width:${pctTiago}%;background:#D4A24C"></div>
  `;

        const catDiogo = (summary.byCategoryPerson || [])
          .filter((r) => r.person_id === "you")
          .sort((a, b) => b.total - a.total)[0];
        const catTiago = (summary.byCategoryPerson || [])
          .filter((r) => r.person_id === "partner")
          .sort((a, b) => b.total - a.total)[0];

        document.getElementById("compare").innerHTML = `
    <div class="who">
      <div class="name" style="color:#7FA98E">Diogo</div>
      <div class="total">${fmt(gastoDiogo)}</div>
      <div class="pct">${pctDiogo.toFixed(0)}% do gasto total do casal este mês</div>
      <div class="top-cat">${catDiogo ? `Categoria onde mais gasta: <b>${catDiogo.category}</b> (${fmt(catDiogo.total)})` : "Sem gastos categorizados ainda"}</div>
    </div>
    <div class="who">
      <div class="name" style="color:#D4A24C">Tiago</div>
      <div class="total">${fmt(gastoTiago)}</div>
      <div class="pct">${pctTiago.toFixed(0)}% do gasto total do casal este mês</div>
      <div class="top-cat">${catTiago ? `Categoria onde mais gasta: <b>${catTiago.category}</b> (${fmt(catTiago.total)})` : "Sem gastos categorizados ainda"}</div>
    </div>
  `;
      }

      function renderInsight(summary, gastoDiogo, gastoTiago, pctLimite) {
        const top = [...summary.byCategory].sort(
          (a, b) => b.total - a.total,
        )[0];
        const monthName = new Date().toLocaleDateString("pt-BR", {
          month: "long",
        });
        const parts = [];
        if (top)
          parts.push(
            `Maior gasto de ${monthName}: <b>${top.category}</b> (${fmt(top.total)})`,
          );
        if (pctLimite >= 85)
          parts.push(
            `<span style="color:var(--coral)">⚠ cartão perto do limite</span>`,
          );
        const diff = gastoDiogo - gastoTiago;
        if (Math.abs(diff) > 1) {
          const maisGastou = diff > 0 ? "Diogo" : "Tiago";
          const outraPessoa = diff > 0 ? "Tiago" : "Diogo";
          parts.push(
            `${maisGastou} gastou ${fmt(Math.abs(diff))} a mais que ${outraPessoa} em ${monthName}`,
          );
        }
        document.getElementById("insight").innerHTML =
          parts.join(" &nbsp;·&nbsp; ") || "Sem dados suficientes ainda.";
      }

      // Lista de barras horizontais — usado tanto pra "gasto por categoria" quanto "parcelas futuras"
      function renderBarList(containerId, rows, emptyMsg) {
        const el = document.getElementById(containerId);
        if (!rows.length) {
          el.innerHTML = `<div class="empty-small">${emptyMsg}</div>`;
          return;
        }
        const max = Math.max(...rows.map((r) => r.total));
        el.innerHTML = rows
          .map((r) => {
            const pct = max ? Math.max(4, (r.total / max) * 100) : 0;
            const color = colorFor(r.category || "Outros");
            return `
      <div class="barrow">
        <div class="barrow-top"><span class="cat">${r.category || "Outros"}</span><span class="val">${fmt(r.total)}</span></div>
        <div class="bartrack"><div class="barfill" style="width:${pct}%;background:${color}"></div></div>
      </div>`;
          })
          .join("");
      }

      function renderCategoryBars(rows) {
        renderBarList(
          "catBars",
          [...rows].sort((a, b) => b.total - a.total),
          "Nenhum gasto este mês ainda.",
        );
      }

      function renderUpcomingBars(rows) {
        const filtered = rows
          .filter((r) => r.total > 0)
          .sort((a, b) => b.total - a.total);
        renderBarList(
          "upcomingBars",
          filtered,
          "Nenhuma parcela em aberto no momento.",
        );
      }

      function renderMonthChart(rows) {
        const months = [...new Set(rows.map((r) => r.month))].sort();
        const people = ["you", "partner"];
        const datasets = people.map((p, i) => ({
          label: p === "you" ? "Diogo" : "Tiago",
          data: months.map((m) => {
            const r = rows.find((x) => x.month === m && x.person_id === p);
            return r ? r.gastos : 0;
          }),
          backgroundColor: i === 0 ? "#7FA98E" : "#D4A24C",
          borderRadius: 4,
        }));
        if (monthChart) monthChart.destroy();
        monthChart = new Chart(document.getElementById("monthChart"), {
          type: "bar",
          data: { labels: months, datasets },
          options: {
            responsive: true,
            scales: {
              x: {
                stacked: true,
                grid: { display: false },
                ticks: { color: "#A9A79B" },
              },
              y: {
                stacked: true,
                grid: { color: "#2a3040" },
                ticks: { color: "#A9A79B" },
              },
            },
            plugins: { legend: { labels: { color: "#EDE7DA" } } },
          },
        });
      }

      function updateMonthLabel() {
        const [y, m] = currentMonth.split("-");
        const label = new Date(Number(y), Number(m) - 1, 1).toLocaleDateString(
          "pt-BR",
          { month: "long", year: "numeric" },
        );
        document.getElementById("monthLabel").textContent =
          label.charAt(0).toUpperCase() + label.slice(1);
      }

      document.getElementById("prevMonth").onclick = () => {
        const [y, m] = currentMonth.split("-").map(Number);
        const d = new Date(y, m - 2, 1);
        currentMonth = d.toISOString().slice(0, 7);
        updateMonthLabel();
        loadTransactions();
      };
      document.getElementById("nextMonth").onclick = () => {
        const [y, m] = currentMonth.split("-").map(Number);
        const d = new Date(y, m, 1);
        currentMonth = d.toISOString().slice(0, 7);
        updateMonthLabel();
        loadTransactions();
      };

      async function loadTransactions() {
        const person = document.getElementById("fPerson").value;
        const category = document.getElementById("fCategory").value;
        let path = `/api/transactions?from=${currentMonth}-01&to=${currentMonth}-31&`;
        if (person) path += `person=${person}&`;
        if (category) path += `category=${encodeURIComponent(category)}&`;

        const txs = await api(path);

        // Categorias reais que existem nos lançamentos exibidos — garante que o <select> de cada
        // linha sempre tenha a opção certa, mesmo que seja uma categoria nova/diferente
        const realCategories = [
          ...new Set(txs.map((t) => t.category).filter(Boolean)),
        ];
        const allKnownCategories = [
          ...new Set([...CATEGORIES, ...realCategories, ...allCategoriesSeen]),
        ];

        if (!txs.length) {
          document.getElementById("txTableWrap").innerHTML =
            '<div class="empty">Nenhum lançamento neste mês.</div>';
          return;
        }

        const rows = txs
          .map(
            (t) => `
    <tr>
      <td>${new Date(t.date).toLocaleDateString("pt-BR")}</td>
      <td class="desc">${t.description}</td>
      <td>${t.person_id === "you" ? "Diogo" : "Tiago"}</td>
      <td>
        <select class="tag-select" data-id="${t.id}">
          ${allKnownCategories.map((c) => `<option value="${c}" ${c === t.category ? "selected" : ""}>${c}</option>`).join("")}
        </select>
      </td>
      <td class="amount" style="color:${t.amount > 0 ? "#D97B66" : "#7FA98E"}">${fmt(t.amount)}</td>
    </tr>
  `,
          )
          .join("");

        document.getElementById("txTableWrap").innerHTML = `
    <table>
      <thead><tr><th>Data</th><th>Descrição</th><th>Pessoa</th><th>Categoria</th><th style="text-align:right">Valor</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

        document.querySelectorAll(".tag-select").forEach((sel) => {
          sel.onchange = async () => {
            await fetch(cfg.url + "/api/transactions/" + sel.dataset.id, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + cfg.secret,
              },
              body: JSON.stringify({ category: sel.value }),
            });
          };
        });
      }

      ["fPerson", "fCategory"].forEach((id) =>
        document
          .getElementById(id)
          .addEventListener("change", loadTransactions),
      );

      updateMonthLabel();
      loadAll();
    </script>
  </body>
</html>
